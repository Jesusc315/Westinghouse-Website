  <script>
    // Mapping JSON sections to template sections with styling
    const SECTION_MAPPING = {
      'Administrators': { bg: 'bg-black', id: 'admin' },
      'Parent Coordinator': { bg: 'gold-bg', id: 'parent-coord' },
      'Office Staff': { bg: 'blue-bg', id: 'office' },
      'Dean of Students': { bg: 'gold-bg', id: 'deans' },
      'Building Support Services': { bg: 'blue-bg', id: 'build-support' },
      'Student Services': { bg: 'gold-bg', id: 'student-services' },
      'School-Based Support Team': { bg: 'blue-bg', id: 'support-team' },
      'Foreign Language': { bg: 'gold-bg', id: 'lang' },
      'Special Education & ENL': { bg: 'blue-bg', id: 'sped' },
      'Career & Technical Education': { bg: 'gold-bg', id: 'cte' },
      'English Language Arts': { bg: 'blue-bg', id: 'ela' },
      'Mathematics': { bg: 'gold-bg', id: 'math' },
      'Physical Education': { bg: 'blue-bg', id: 'phys' },
      'Natural Sciences': { bg: 'gold-bg', id: 'sci' },
      'Social Studies': { bg: 'blue-bg', id: 'social' },
      'Paraprofessional Staff': { bg: 'gold-bg', id: 'para' }
    };

    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('staff-container');

      function createStaffCard(staff) {
        return `
          <div class="card mb-3 mx-auto">
            <div class="row g-0">
              <div class="col-3">
                <img src="${staff.photo || '/images/index-page/gwhs-logo.webp'}" class="w-100" alt="image of ${staff.name}" />
              </div>
              <div class="col-9">
                <div class="card-body">
                  <h5 class="card-title">${staff.name}</h5>
                  <p class="card-text">${staff.role || ''}</p>
                  <div class="row pt-1">
                    <div class="col-6 text-end">
                      <a href="mailto:${staff.email}" class="btn" target="_blank" rel="noopener">
                        <img src="/images/icons/envelope-at.svg" alt="envelope icon" />
                      </a>
                    </div>
                    <div class="col-6 text-start">
                      <a href="https://calendly.com/${(staff.email || '').split('@')[0]}-schools/parent-teacher-conference" class="btn" target="_blank" rel="noopener">
                        <img src="/images/icons/calendar3.svg" alt="calendar icon" />
                      </a>
                    </div>
                  </div>
                  <p>${staff.email}</p>
                  <p class="room-lift">${staff.bio || ''}</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      fetch('data/staff.json')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(data => {
          if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<p class="text-muted">No staff members found.</p>';
            return;
          }

          // Group staff by section
          const sections = {};
          data.forEach(staff => {
            const sectionName = staff.section || 'Other';
            if (!sections[sectionName]) {
              sections[sectionName] = [];
            }
            sections[sectionName].push(staff);
          });

          // Render sections
          Object.keys(sections).forEach(sectionName => {
            const mapping = SECTION_MAPPING[sectionName] || { bg: 'bg-light', id: sectionName.toLowerCase().replace(/\s+/g, '-') };
            const staffList = sections[sectionName];

            const sectionHtml = `
              <section class="p-3 py-lg-4 text-center text-sm-start department ${mapping.bg}" id="${mapping.id}">
                <div class="container text-center py-4">
                  <div class="row mb-3">
                    <h2 id="section-${mapping.id}" class="pb-3">${sectionName}</h2>
                    <hr class="text-white" />
                  </div>
                  <div class="row" id="cards-${mapping.id}">
                    ${staffList.map(staff => createStaffCard(staff)).join('')}
                  </div>
                </div>
              </section>
            `;

            container.insertAdjacentHTML('beforeend', sectionHtml);
          });
        })
        .catch(error => {
          console.error('Error loading staff data:', error);
          container.innerHTML = '<p class="text-danger">Unable to load staff data at this time.</p>';
        });
    });
  </script>
